<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BigPost — Definir senha</title>
<style>
:root{--bg:#f4f6f8;--ink:#17324d;--line:#e5e8eb;--muted:#667684;--accent:#17324d}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 Arial,sans-serif;background:var(--bg);color:var(--ink)}
.hidden{display:none!important}
.wrap{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);padding:20px}
.box{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);max-width:380px;width:100%}
.login-logo{display:block;width:min(260px,72vw);height:auto;max-height:120px;object-fit:contain;margin:0 auto 14px}
h2{text-align:center;margin:0 0 6px}
.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.field label{font-size:12px;color:var(--muted)}
input{padding:9px;border:1px solid #ccd4dc;border-radius:7px;font:inherit;width:100%}
.action{padding:9px 14px;border:0;border-radius:7px;background:var(--ink);color:#fff;cursor:pointer;font-size:14px;width:100%;margin-top:8px}
.notice{color:var(--muted);font-size:12px}
.err{color:#a53030;font-size:13px;margin:8px 0 0}
.ok{color:#187a3f;font-size:13px;margin:8px 0 0}
ul.rules{font-size:12px;color:var(--muted);margin:6px 0 0;padding-left:18px}
</style>
</head>
<body>
<div class="wrap">
  <form id="setForm" class="box" autocomplete="off">
    <img class="login-logo" src="/bigpost_logo.png" alt="BigPost">
    <h2 id="title">Definir senha</h2>
    <p class="notice" id="intro">Escolha uma senha para acessar o BigPost.</p>
    <div id="formFields">
      <div class="field"><label>Nova senha</label><input id="p1" type="password" autocomplete="new-password"></div>
      <div class="field"><label>Confirmar senha</label><input id="p2" type="password" autocomplete="new-password"></div>
      <ul class="rules">
        <li>Entre 6 e 15 caracteres</li>
        <li>Pelo menos uma letra maiúscula, uma minúscula e um número</li>
      </ul>
      <button id="submitBtn" type="submit" class="action">Salvar senha</button>
    </div>
    <p id="msg"></p>
    <p class="notice hidden" id="backLink"><a href="./">&larr; Voltar ao login</a></p>
  </form>
</div>
<script>
const $ = x => document.getElementById(x);
const params = new URLSearchParams(location.search);
const token = params.get('token');

function fail(text) {
  $('formFields').classList.add('hidden');
  $('msg').innerHTML = '';
  $('msg').className = 'err';
  $('msg').textContent = text;
  $('backLink').classList.remove('hidden');
}

if (!token) {
  fail('Link inválido — falta o código de acesso. Peça um novo link de convite ou redefinição.');
}

$('setForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  if (!token) return;
  const p1 = $('p1').value, p2 = $('p2').value;
  $('msg').className = 'err';
  $('msg').textContent = '';
  if (p1.length < 6 || p1.length > 15) { $('msg').textContent = 'A senha deve ter entre 6 e 15 caracteres.'; return; }
  if (!/[0-9]/.test(p1)) { $('msg').textContent = 'A senha precisa de pelo menos um número.'; return; }
  if (!/[A-Z]/.test(p1)) { $('msg').textContent = 'A senha precisa de pelo menos uma letra maiúscula.'; return; }
  if (!/[a-z]/.test(p1)) { $('msg').textContent = 'A senha precisa de pelo menos uma letra minúscula.'; return; }
  if (p1 !== p2) { $('msg').textContent = 'As senhas não coincidem.'; return; }

  $('submitBtn').disabled = true;
  try {
    const res = await fetch('/api/v1/auth/password/set', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: p1 }),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.detail || 'Não foi possível definir a senha.');
    $('formFields').classList.add('hidden');
    $('msg').className = 'ok';
    $('msg').textContent = 'Senha definida com sucesso! Você já pode entrar com seu e-mail e a nova senha.';
    $('backLink').classList.remove('hidden');
  } catch (e) {
    $('msg').className = 'err';
    $('msg').textContent = e.message;
    $('submitBtn').disabled = false;
  }
});
</script>
</body>
</html>
